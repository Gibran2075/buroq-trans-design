<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="BUROQ TRANS logo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12295A"/>
      <stop offset="1" stop-color="#041630"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8CA57"/>
      <stop offset="1" stop-color="#D9B52B"/>
    </linearGradient>
    <path id="arcTop" d="M 60,60 m -42,0 a 42,42 0 0 1 84,0" fill="none"/>
    <path id="arcBottom" d="M 60,60 m -40,0 a 40,40 0 0 0 80,0" fill="none"/>
  </defs>

  <!-- badge body -->
  <circle cx="60" cy="60" r="58" fill="url(#goldGrad)"/>
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad)"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#D9B52B" stroke-width="1.4" stroke-dasharray="2.5 5" opacity=".85"/>

  <!-- circular wording -->
  <text font-family="Poppins, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="3.6" fill="#E8CA57">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">BUROQ TRANS</textPath>
  </text>
  <text font-family="Poppins, Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="3.4" fill="#9FB0CC">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">KARAWANG</textPath>
  </text>

  <!-- front-facing car mark -->
  <g transform="translate(60 58)">
    <rect x="-16" y="-14" width="32" height="13" rx="5" fill="url(#goldGrad)"/>
    <rect x="-12" y="-11" width="24" height="7" rx="3" fill="#041630"/>
    <rect x="-19" y="-2" width="38" height="15" rx="5" fill="url(#goldGrad)"/>
    <rect x="-15" y="3" width="10" height="5.5" rx="2" fill="#041630"/>
    <rect x="5" y="3" width="10" height="5.5" rx="2" fill="#041630"/>
    <rect x="-15" y="13" width="10" height="5" rx="2" fill="#041630"/>
    <rect x="5" y="13" width="10" height="5" rx="2" fill="#041630"/>
    <rect x="-23" y="20" width="46" height="3.4" rx="1.7" fill="#D9B52B"/>
  </g>
</svg>
